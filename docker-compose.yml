services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: founder_os
      POSTGRES_USER: founder_os
      POSTGRES_PASSWORD: founder_os
    ports:
      - "5432:5432"
    volumes:
      - founder_os_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founder_os -d founder_os"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  founder_os_postgres:

